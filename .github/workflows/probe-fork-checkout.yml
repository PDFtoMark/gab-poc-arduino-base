name: fork_checkout_probe
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
jobs:
  probe:
    if: github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/probe-fork-checkout')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout a fork repo of this repository (different repo id)
        uses: actions/checkout@v7
        with:
          repository: PDFtoMark/gab-poc-arduino-base-1
          ref: 403468127a1864ecf8ed864f8057ea9f6f8e6c6e
          fetch-depth: 1
      - name: Run script from the fork repo
        shell: bash
        run: |
          bash eng/ArduinoCsCI.sh
